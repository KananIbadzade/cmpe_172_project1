# App + PostgreSQL. Copy .env.example to .env first; DB_PASSWORD has no default on purpose.
#   docker compose up --build
#   curl localhost:8080/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: advising
      POSTGRES_USER: ${DB_USERNAME:-advising}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d advising"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/advising
      DB_USERNAME: ${DB_USERNAME:-advising}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: docker
      NOTIFICATION_MOCK_MODE: ${NOTIFICATION_MOCK_MODE:-UP}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "8080:8080"
    restart: on-failure
