<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advising Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <div class="p-4 mb-4 bg-light rounded-3">
        <h1 class="display-6">University Academic Advising</h1>
        <p class="lead mb-3">Book advising sessions with SJSU advisors. Browse open slots, reserve one, or manage your availability if you are an advisor.</p>
        <a class="btn btn-primary me-2" th:href="@{/slots}">Browse available slots</a>
        <a class="btn btn-outline-secondary" th:href="@{/login}">Log in</a>
    </div>
    <p class="text-muted">Demo password for all seed accounts: <code>password123</code></p>
</main>
</body>
</html>
