<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Advising Scheduler</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/slots}">Browse slots</a>
            <a class="nav-link" th:if="${user != null and user.role.name() == 'STUDENT'}"
               th:href="@{/my-appointments}">My appointments</a>
            <a class="nav-link" th:if="${user != null and user.role.name() == 'ADVISOR'}"
               th:href="@{/advisor}">Advisor dashboard</a>
        </div>
        <div class="d-flex align-items-center gap-2">
            <span class="navbar-text text-white-50" th:if="${user != null}"
                  th:text="${user.fullName + ' (' + user.role.name() + ')'}">User</span>
            <a class="btn btn-outline-light btn-sm" th:if="${user == null}" th:href="@{/login}">Log in</a>
            <form th:if="${user != null}" th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
