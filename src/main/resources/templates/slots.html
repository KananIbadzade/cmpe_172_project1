<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Available slots — Advising Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <h1 class="h3 mb-3">Available slots</h1>

    <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>

    <form class="row g-2 mb-4" method="get" th:action="@{/slots}">
        <div class="col-md-3">
            <label class="form-label">Provider</label>
            <select class="form-select" name="providerId">
                <option value="">All</option>
                <option th:each="p : ${providers}" th:value="${p.id()}"
                        th:selected="${providerId != null and providerId == p.id()}"
                        th:text="${p.fullName()}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Service</label>
            <select class="form-select" name="serviceId">
                <option value="">All</option>
                <option th:each="s : ${services}" th:value="${s.id()}"
                        th:selected="${serviceId != null and serviceId == s.id()}"
                        th:text="${s.name()}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Date</label>
            <input class="form-control" type="date" name="date"
                   th:value="${date}">
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button class="btn btn-primary me-2" type="submit">Filter</button>
            <a class="btn btn-outline-secondary" th:href="@{/slots}">Reset</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Provider</th>
                <th>Service</th>
                <th>Start</th>
                <th>End</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="slot : ${page.items()}">
                <td th:text="${slot.id()}">1</td>
                <td th:text="${slot.providerId()}">1</td>
                <td th:text="${slot.serviceId()}">1</td>
                <td th:text="${#temporals.format(slot.startTime(), 'yyyy-MM-dd HH:mm')}">time</td>
                <td th:text="${#temporals.format(slot.endTime(), 'yyyy-MM-dd HH:mm')}">time</td>
                <td>
                    <a class="btn btn-sm btn-success"
                       th:if="${user != null and user.role.name() == 'STUDENT'}"
                       th:href="@{/book/{id}(id=${slot.id()})}">Book</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:if="${user == null}"
                       th:href="@{/login}">Log in to book</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(page.items())}">
                <td colspan="6" class="text-muted">No open slots match these filters.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-between align-items-center">
        <div class="text-muted">
            Page <span th:text="${page.page() + 1}">1</span>
            of <span th:text="${page.totalPages() == 0 ? 1 : page.totalPages()}">1</span>
            (<span th:text="${page.totalItems()}">0</span> slots)
        </div>
        <div>
            <a class="btn btn-outline-primary btn-sm me-1"
               th:if="${page.page() > 0}"
               th:href="@{/slots(page=${page.page() - 1}, providerId=${providerId}, serviceId=${serviceId}, date=${date})}">
                Prev
            </a>
            <a class="btn btn-outline-primary btn-sm"
               th:if="${page.totalPages() > 0 and page.page() + 1 < page.totalPages()}"
               th:href="@{/slots(page=${page.page() + 1}, providerId=${providerId}, serviceId=${serviceId}, date=${date})}">
                Next
            </a>
        </div>
    </div>
</main>
</body>
</html>
