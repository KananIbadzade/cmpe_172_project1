<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My appointments — Advising Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <h1 class="h3 mb-3">My appointments</h1>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Provider</th>
                <th>Service</th>
                <th>Slot</th>
                <th>Status</th>
                <th>Notes</th>
                <th>Created</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${a.id()}">1</td>
                <td>
                    <span th:each="p : ${providers}" th:if="${p.id() == a.providerId()}"
                          th:text="${p.fullName()}">Advisor</span>
                </td>
                <td>
                    <span th:each="s : ${services}" th:if="${s.id() == a.serviceId()}"
                          th:text="${s.name()}">Service</span>
                </td>
                <td th:text="${a.slotId()}">1</td>
                <td>
                    <span class="badge"
                          th:classappend="${a.status() == 'BOOKED'} ? ' text-bg-primary' : (${a.status() == 'CANCELLED'} ? ' text-bg-secondary' : ' text-bg-success')"
                          th:text="${a.status()}">BOOKED</span>
                </td>
                <td th:text="${a.notes()}">notes</td>
                <td th:text="${#temporals.format(a.createdAt(), 'yyyy-MM-dd HH:mm')}">time</td>
                <td>
                    <form th:if="${a.status() == 'BOOKED'}"
                          th:action="@{/my-appointments/{id}/cancel(id=${a.id()})}"
                          method="post"
                          onsubmit="return confirm('Cancel this appointment?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Cancel</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="8" class="text-muted">No appointments yet.
                    <a th:href="@{/slots}">Browse slots</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
