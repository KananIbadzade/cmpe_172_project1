<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Advising Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container" style="max-width: 480px;">
    <h1 class="h3 mb-3">Log in</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

    <form th:action="@{/login}" method="post" class="card card-body shadow-sm mb-3">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required
                   placeholder="alex.kim@sjsu.edu">
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required
                   value="password123">
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>

    <div class="card card-body bg-light">
        <p class="mb-2 fw-semibold">Demo accounts (password <code>password123</code>)</p>
        <button type="button" class="btn btn-sm btn-outline-primary mb-2"
                onclick="document.getElementById('email').value='alex.kim@sjsu.edu'">
            Student: alex.kim@sjsu.edu
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary"
                onclick="document.getElementById('email').value='maria.chen@sjsu.edu'">
            Advisor: maria.chen@sjsu.edu
        </button>
    </div>
</main>
</body>
</html>
