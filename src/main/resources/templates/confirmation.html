<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Booking confirmed — Advising Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container" style="max-width: 640px;">
    <div class="alert alert-success">
        <h1 class="h4 mb-1">Booking confirmed</h1>
        <p class="mb-0">Your advising appointment is on the calendar.</p>
    </div>

    <div class="card card-body mb-3">
        <p class="mb-1"><strong>Appointment ID:</strong> <span th:text="${appointment.id()}"></span></p>
        <p class="mb-1"><strong>Status:</strong> <span th:text="${appointment.status()}"></span></p>
        <p class="mb-1"><strong>Advisor:</strong> <span th:text="${providerName}"></span></p>
        <p class="mb-1"><strong>Service:</strong> <span th:text="${serviceName}"></span></p>
        <p class="mb-1"><strong>Slot ID:</strong> <span th:text="${appointment.slotId()}"></span></p>
        <p class="mb-0"><strong>Notes:</strong>
            <span th:text="${appointment.notes() != null ? appointment.notes() : '—'}">—</span></p>
    </div>

    <a class="btn btn-primary" th:href="@{/my-appointments}">View my appointments</a>
    <a class="btn btn-outline-secondary" th:href="@{/slots}">Browse more slots</a>
</main>
</body>
</html>
