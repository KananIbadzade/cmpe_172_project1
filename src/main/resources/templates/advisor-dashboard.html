<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Advisor dashboard — Advising Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <h1 class="h3 mb-1">Advisor dashboard</h1>
    <p class="text-muted mb-3"
       th:text="${provider.department() + ' · ' + provider.officeLocation()}">Dept</p>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="mb-5">
        <h2 class="h5">Publish a new slot</h2>
        <form th:action="@{/advisor/slots}" method="post" class="row g-2 card card-body shadow-sm">
            <div class="col-md-4">
                <label class="form-label">Service</label>
                <select class="form-select" name="serviceId" required>
                    <option th:each="s : ${services}" th:value="${s.id()}" th:text="${s.name()}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Start</label>
                <input class="form-control" type="datetime-local" name="startTime" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">End</label>
                <input class="form-control" type="datetime-local" name="endTime" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100" type="submit">Add slot</button>
            </div>
        </form>
    </section>

    <section class="mb-5">
        <h2 class="h5">My availability slots</h2>
        <div class="table-responsive">
            <table class="table table-sm table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Service</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Booked?</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="slot : ${slots}">
                    <td th:text="${slot.id()}">1</td>
                    <td>
                        <span th:each="s : ${services}" th:if="${s.id() == slot.serviceId()}"
                              th:text="${s.name()}">Service</span>
                    </td>
                    <td th:text="${#temporals.format(slot.startTime(), 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${#temporals.format(slot.endTime(), 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${slot.booked() ? 'Yes' : 'No'}">No</td>
                    <td>
                        <form th:if="${!slot.booked()}"
                              th:action="@{/advisor/slots/{id}/remove(id=${slot.id()})}"
                              method="post"
                              onsubmit="return confirm('Remove this open slot?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section>
        <h2 class="h5">Appointments with me</h2>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Student (user id)</th>
                    <th>Slot</th>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Notes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${appointments}">
                    <td th:text="${a.id()}"></td>
                    <td th:text="${a.customerId()}"></td>
                    <td th:text="${a.slotId()}"></td>
                    <td>
                        <span th:each="s : ${services}" th:if="${s.id() == a.serviceId()}"
                              th:text="${s.name()}"></span>
                    </td>
                    <td th:text="${a.status()}"></td>
                    <td th:text="${a.notes()}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="6" class="text-muted">No appointments yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
