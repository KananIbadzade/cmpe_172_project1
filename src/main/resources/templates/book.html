<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book slot — Advising Scheduler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container" style="max-width: 640px;">
    <h1 class="h3 mb-3">Book appointment</h1>

    <div class="card mb-3">
        <div class="card-body">
            <p class="mb-1"><strong>Advisor:</strong> <span th:text="${providerName}">Name</span></p>
            <p class="mb-1"><strong>Service:</strong> <span th:text="${serviceName}">Service</span></p>
            <p class="mb-1"><strong>Start:</strong>
                <span th:text="${#temporals.format(slot.startTime(), 'yyyy-MM-dd HH:mm')}"></span></p>
            <p class="mb-0"><strong>End:</strong>
                <span th:text="${#temporals.format(slot.endTime(), 'yyyy-MM-dd HH:mm')}"></span></p>
        </div>
    </div>

    <form th:action="@{/book/{id}(id=${slot.id()})}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label class="form-label" for="notes">Notes (optional)</label>
            <textarea class="form-control" id="notes" name="notes" rows="3"
                      placeholder="What do you want to discuss?"></textarea>
        </div>
        <button class="btn btn-success" type="submit">Confirm booking</button>
        <a class="btn btn-link" th:href="@{/slots}">Cancel</a>
    </form>
</main>
</body>
</html>
