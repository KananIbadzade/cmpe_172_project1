spring.application.name=advising-scheduler

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/advising}
spring.datasource.username=${DB_USERNAME:advising}
spring.datasource.password=${DB_PASSWORD:}

# Non-embedded databases need mode=always; seed.sql is not the default data.sql name.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

app.environment=${APP_ENV:local}
app.milestone=milestone-1
