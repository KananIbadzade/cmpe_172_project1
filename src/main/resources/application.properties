spring.application.name=advising-scheduler

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/advising}
spring.datasource.username=${DB_USERNAME:advising}
spring.datasource.password=${DB_PASSWORD:}

# Non-embedded databases need mode=always; seed.sql is not the default data.sql name.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

app.environment=${APP_ENV:local}

# Mock notification service. UP accepts, DOWN returns 503, SLOW waits before accepting.
app.notification.mock.mode=${NOTIFICATION_MOCK_MODE:UP}
app.notification.mock.slow-delay-ms=3000

# Notification gateway. A blank base-url calls the mock inside this app.
app.notification.base-url=${NOTIFICATION_BASE_URL:}
app.notification.connect-timeout-ms=500
app.notification.read-timeout-ms=1000
app.notification.max-attempts=3
app.notification.retry-backoff-ms=200

# Actuator at the root: GET /health (with database check) and GET /metrics/{name}.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
app.milestone=milestone-3
