spring.application.name=advising-scheduler

# Local convenience: read KEY=value lines from a .env file in the working directory (git-ignored).
# Real environment variables win over the file, and a missing file is fine (CI, Docker).
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/advising}
spring.datasource.username=${DB_USERNAME:advising}
spring.datasource.password=${DB_PASSWORD:}

# Flyway applies db/migration/V*__*.sql once each and skips them on later startups,
# so bookings survive restarts. Nothing drops or recreates tables at startup.
spring.flyway.locations=classpath:db/migration

app.environment=${APP_ENV:local}

# Mock notification service. UP accepts, DOWN returns 503, SLOW waits before accepting.
app.notification.mock.mode=${NOTIFICATION_MOCK_MODE:UP}
app.notification.mock.slow-delay-ms=3000

# Notification gateway. A blank base-url calls the mock inside this app.
app.notification.base-url=${NOTIFICATION_BASE_URL:}
app.notification.connect-timeout-ms=500
app.notification.read-timeout-ms=1000
app.notification.max-attempts=3
app.notification.retry-backoff-ms=200

# Actuator at the root: GET /health (with database check) and GET /metrics/{name}.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
app.milestone=milestone-4

# Gemini Developer API (free AI Studio key). Do NOT set project-id/location (Vertex AI mode).
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.3
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
# Chat history lives in the spring_ai_chat_memory table, which Flyway creates (V4); Spring AI must not.
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

# Agent 2: scheduled reminders. Set REMINDERS_ENABLED=false to run them only from the manual trigger.
app.reminders.enabled=${REMINDERS_ENABLED:true}
app.reminders.cron=${REMINDERS_CRON:0 */15 * * * *}
app.reminders.window-hours=${REMINDER_WINDOW_HOURS:24}
