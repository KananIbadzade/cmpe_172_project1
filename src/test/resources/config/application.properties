# Test-only overrides, loaded on top of src/main/resources/application.properties.
# MockMvc tests start no real server, so a blank base-url would fall back to port 8080,
# which may be a locally running copy of the app. Nothing listens on port 1, so those
# notifications fail fast and take the fallback path. Tests that need the real mock
# set app.notification.base-url= (blank) to call their own random port.
app.notification.base-url=http://localhost:1
app.notification.retry-backoff-ms=10
